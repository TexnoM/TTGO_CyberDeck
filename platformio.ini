; ============================================================================
; TTGO_CyberDeck — Pocket Cyberdeck Firmware for TTGO T-Display 1.14" ESP32
; ============================================================================
[platformio]
name = TTGO_CyberDeck
default_envs = ttgo-t-display-clone

[env:ttgo-t-display-clone]
platform = espressif32
board = esp32dev
framework = arduino

; Serial Monitor & Upload configuration
monitor_speed = 115200
upload_speed = 921600
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = dio
board_upload.flash_size = 4MB
board_build.flash_size = 4MB
board_build.partitions = min_spiffs.csv

; High-performance Graphics Driver & Cyrillic/Unicode Font Support
lib_deps =
    lovyan03/LovyanGFX @ ^1.2.0
    olikraus/U8g2 @ ^2.35.9

build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DTTGO_CYBERDECK_VERSION=\"1.2.0-CYBER\"
    -O2
    -Wall
    -Wextra
    -Wno-unused-parameter

; Optional hardware profile override environment for Clone Variant B
[env:ttgo-t-display-clone-alt]
extends = env:ttgo-t-display-clone
build_flags =
    ${env:ttgo-t-display-clone.build_flags}
    -DHW_PROFILE_VARIANT_B=1
