; ============================================================================
; NEON DECK — Pocket Cyberdeck Firmware for TTGO T-Display 1.14" ESP32 Clone
; ============================================================================
[platformio]
default_envs = ttgo-t-display-clone

[env:ttgo-t-display-clone]
platform = espressif32
board = esp32dev
framework = arduino

; Serial Monitor & Upload configuration
monitor_speed = 115200
upload_speed = 921600
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = dio
board_build.partitions = min_spiffs.csv

; High-performance Graphics Driver (LovyanGFX handles ST7789 clones, custom
; offsets, DMA sprites, and ESP32 Arduino Core 2.x/3.x reliably)
lib_deps =
    lovyan03/LovyanGFX @ ^1.2.0

build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DNEON_DECK_VERSION=\"1.0.0-CYBER\"
    -O2
    -Wall
    -Wextra
    -Wno-unused-parameter

; Optional hardware profile override environment for Clone Variant B
[env:ttgo-t-display-clone-alt]
extends = env:ttgo-t-display-clone
build_flags =
    ${env:ttgo-t-display-clone.build_flags}
    -DHW_PROFILE_VARIANT_B=1
