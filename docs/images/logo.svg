<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="240">
  <defs>
    <linearGradient id="cyberBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c10"/>
      <stop offset="50%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#080a0e"/>
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#00a8ff"/>
    </linearGradient>
    <linearGradient id="neonGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ff9d"/>
      <stop offset="100%" stop-color="#00c853"/>
    </linearGradient>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect x="2" y="2" width="796" height="236" rx="8" fill="url(#cyberBg)" stroke="#1f2937" stroke-width="2"/>

  <!-- Subtle Cyber Grid -->
  <g stroke="#161f2e" stroke-width="1" opacity="0.6">
    <line x1="20" y1="40" x2="780" y2="40"/>
    <line x1="20" y1="80" x2="780" y2="80"/>
    <line x1="20" y1="120" x2="780" y2="120"/>
    <line x1="20" y1="160" x2="780" y2="160"/>
    <line x1="20" y1="200" x2="780" y2="200"/>
    <line x1="160" y1="10" x2="160" y2="230"/>
    <line x1="320" y1="10" x2="320" y2="230"/>
    <line x1="480" y1="10" x2="480" y2="230"/>
    <line x1="640" y1="10" x2="640" y2="230"/>
  </g>

  <!-- Corner Sci-Fi Brackets -->
  <path d="M 12 32 L 12 12 L 32 12" fill="none" stroke="#00f0ff" stroke-width="2"/>
  <path d="M 768 12 L 788 12 L 788 32" fill="none" stroke="#00f0ff" stroke-width="2"/>
  <path d="M 788 208 L 788 228 L 768 228" fill="none" stroke="#00f0ff" stroke-width="2"/>
  <path d="M 32 228 L 12 228 L 12 208" fill="none" stroke="#00f0ff" stroke-width="2"/>

  <!-- Hardware Icon: Pocket Cyberdeck Frame -->
  <g transform="translate(48, 40)">
    <rect x="0" y="0" width="80" height="150" rx="8" fill="#111827" stroke="#00f0ff" stroke-width="2" filter="url(#glowCyan)"/>
    <!-- Screen Bezel -->
    <rect x="8" y="14" width="64" height="106" rx="3" fill="#05080c" stroke="#00ff9d" stroke-width="1.5"/>
    <!-- Terminal Prompt & Clock -->
    <rect x="14" y="24" width="36" height="4" fill="#00ff9d"/>
    <rect x="14" y="34" width="48" height="2" fill="#00a8ff" opacity="0.8"/>
    <text x="40" y="70" font-family="Courier, monospace" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">13:37</text>
    <rect x="18" y="80" width="44" height="3" fill="#1f2937"/>
    <rect x="18" y="80" width="28" height="3" fill="#00f0ff"/>
    <!-- Physical Buttons -->
    <rect x="14" y="128" width="22" height="10" rx="2" fill="#1e293b" stroke="#00f0ff" stroke-width="1"/>
    <rect x="44" y="128" width="22" height="10" rx="2" fill="#1e293b" stroke="#00ff9d" stroke-width="1"/>
  </g>

  <!-- Title -->
  <text x="170" y="100" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="44" font-weight="900" letter-spacing="4" fill="url(#neonCyan)" filter="url(#glowCyan)">TTGO_CYBERDECK</text>

  <!-- Tagline Badges -->
  <g transform="translate(172, 136)">
    <rect x="0" y="0" width="100" height="24" rx="4" fill="#111827" stroke="#374151" stroke-width="1"/>
    <text x="50" y="16" font-family="monospace" font-size="11" fill="#9ca3af" text-anchor="middle">LITTLEFS</text>

    <rect x="110" y="0" width="115" height="24" rx="4" fill="#111827" stroke="#374151" stroke-width="1"/>
    <text x="167" y="16" font-family="monospace" font-size="11" fill="#00f0ff" text-anchor="middle">AGPL-3.0-ONLY</text>

    <rect x="235" y="0" width="95" height="24" rx="4" fill="#111827" stroke="#374151" stroke-width="1"/>
    <text x="282" y="16" font-family="monospace" font-size="11" fill="#00ff9d" text-anchor="middle">UA / EN I18N</text>

    <rect x="340" y="0" width="125" height="24" rx="4" fill="#111827" stroke="#374151" stroke-width="1"/>
    <text x="402" y="16" font-family="monospace" font-size="11" fill="#f59e0b" text-anchor="middle">DEEP SLEEP DIM</text>
  </g>

  <!-- Status indicator -->
  <circle cx="740" cy="40" r="4" fill="#00ff9d" filter="url(#glowCyan)"/>
  <text x="730" y="44" font-family="monospace" font-size="10" fill="#6b7280" text-anchor="end">READY</text>
</svg>
